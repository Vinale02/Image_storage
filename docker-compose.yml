services:
  app:
    build: .
    container_name: app_image
    restart: unless-stopped
    volumes:
      - ./images:/app/images
      - ./log:/app/logs
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - postgres
    networks:
      - postgres-network

  nginx:
    image: nginx:1.30
    container_name: nginx_image
    depends_on:
      - app
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./images:/images:ro
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - postgres-network

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./import:/import:ro
    networks:
      - postgres-network

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - postgres-network
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:

networks:
  postgres-network:
    driver: bridge